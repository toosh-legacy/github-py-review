<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 400px;
        max-height: 580px;
        overflow-y: auto;
        font-family: -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1f2328;
      }
      h3 { margin: 0 0 8px; }
      .summary { color: #57606a; font-size: 13px; margin-bottom: 8px; }
      .chips { margin-bottom: 8px; }
      .chip {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        padding: 2px 7px;
        margin-right: 4px;
        border-radius: 10px;
        color: #fff;
      }
      .chip.high { background: #cf222e; }
      .chip.medium { background: #bf8700; }
      .chip.low { background: #6e7781; }
      .warn {
        font-size: 11px;
        color: #7d4e00;
        background: #fff8c5;
        border: 1px solid #f0e0a0;
        border-radius: 4px;
        padding: 5px 7px;
        margin-bottom: 6px;
      }
      .issue {
        border-left: 3px solid #ccc;
        padding: 7px 9px;
        margin-bottom: 7px;
        background: #f6f8fa;
        border-radius: 4px;
        font-size: 13px;
      }
      .high { border-color: #cf222e; }
      .medium { border-color: #bf8700; }
      .low { border-color: #6e7781; }
      .head { font-size: 11px; text-transform: uppercase; color: #57606a; }
      .head b { color: #24292f; }
      .rule { font-family: monospace; text-transform: none; }
      .title { font-weight: 600; margin: 2px 0; }
      .loc { font-family: monospace; color: #0969da; font-size: 12px; }
      .evidence {
        font-family: monospace;
        font-size: 11px;
        background: #eff1f3;
        border-radius: 3px;
        padding: 3px 5px;
        margin-top: 4px;
        white-space: pre-wrap;
        word-break: break-all;
      }
      .why { margin-top: 5px; }
      .fix {
        color: #0a3069;
        background: #ddf4ff;
        border-radius: 3px;
        padding: 4px 6px;
        margin-top: 5px;
      }
      .meta { color: #8b949e; font-size: 11px; margin-top: 4px; word-break: break-all; }
      .cfg { margin-top: 10px; font-size: 12px; border-top: 1px solid #d0d7de; padding-top: 8px; }
      .cfg label { display: block; margin-bottom: 6px; }
      .cfg input { width: 230px; }
      code { background: #eff1f3; padding: 0 3px; border-radius: 3px; }
      a { color: #0969da; }
      .hint { color: #8b949e; font-size: 11px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h3>🛡️ Repo Security Scanner</h3>
    <div id="content" class="summary">
      No scan yet. Open a GitHub repository → “Security scan” to check it for
      exposed secrets, vulnerable dependencies, and unsafe code patterns.
    </div>
    <div class="cfg">
      <label>Backend: <input id="backend" placeholder="http://localhost:8001" /></label>
      <label>GitHub token (optional): <input id="ghToken" type="password" placeholder="ghp_… raises API limit" /></label>
      <button id="save">Save</button>
      <div class="hint">
        Token is stored locally and only used to list and read repository files.
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>

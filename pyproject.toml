# Tooling config only — the project is run from source, not installed.
# Dependencies live in requirements.txt.

[tool.ruff]
line-length = 90
exclude = [".venv", "_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: `Depends(...)` in a default is how FastAPI injection is written.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import roots: the app packages live in src/ (`import backend`, `import agent`,
# ...); "." lets tests import the ml/ training package (`import ml.curate_dataset`).
pythonpath = ["src", "."]
addopts = "-q"

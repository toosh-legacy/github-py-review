# Tooling config only — the project is run from source, not installed.
# Dependencies live in requirements.txt.

[tool.ruff]
line-length = 90
exclude = [".venv", "_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: `Depends(...)` in a default is how FastAPI injection is written.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Single import root: every package lives under src/ — `import backend`,
# `import agent`, `import ml.curate_dataset`, ...
pythonpath = ["src"]
addopts = "-q"

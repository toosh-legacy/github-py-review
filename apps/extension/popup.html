<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 360px;
        font-family: -apple-system, Segoe UI, sans-serif;
        margin: 0;
        padding: 12px;
        color: #1f2328;
      }
      h3 { margin: 0 0 8px; }
      .summary { color: #57606a; font-size: 13px; margin-bottom: 8px; }
      .issue {
        border-left: 3px solid #ccc;
        padding: 6px 8px;
        margin-bottom: 6px;
        background: #f6f8fa;
        border-radius: 4px;
        font-size: 13px;
      }
      .high { border-color: #cf222e; }
      .medium { border-color: #bf8700; }
      .low { border-color: #bc8b00; }
      .loc { font-family: monospace; color: #0969da; }
      .fix { color: #57606a; font-style: italic; margin-top: 4px; }
      .cfg { margin-top: 10px; font-size: 12px; }
      .cfg label { display: block; margin-bottom: 6px; }
      .cfg input { width: 210px; }
      code { background: #eff1f3; padding: 0 3px; border-radius: 3px; }
      a { color: #0969da; }
      .hint { color: #8b949e; font-size: 11px; margin-top: 6px; }
    </style>
  </head>
  <body>
    <h3>🤖 Code Review &amp; Debug</h3>
    <div id="content" class="summary">
      No result yet. Open a GitHub PR → “Review this PR”, or a repo →
      “Scan &amp; Debug file”.
    </div>
    <div class="cfg">
      <label>Backend: <input id="backend" placeholder="http://localhost:8001" /></label>
      <label>GitHub token (optional): <input id="ghToken" type="password" placeholder="ghp_… raises API limit" /></label>
      <button id="save">Save</button>
      <div class="hint">Token is stored locally and only used to list repo files.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
